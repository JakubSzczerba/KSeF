framework:
    messenger:
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    auto_setup: true

        routing:
            'Ksef\Backend\Invoice\Application\SendInvoiceCommand': async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
